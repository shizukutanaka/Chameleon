version: '3.8'

services:
  chameleon:
    build: .
    image: chameleon-audio:latest
    container_name: chameleon-audio
    volumes:
      - ./data:/data
      - ./output:/output
    environment:
      - CHAMELEON_MODE=production
      - LOG_LEVEL=INFO
    command: python chameleon.py process /data/input.wav -o /output/processed.wav --operation normalize

  chameleon-api:
    build: .
    image: chameleon-audio:latest
    container_name: chameleon-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./output:/output
    environment:
      - CHAMELEON_MODE=api
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: python api_server.py

  chameleon-worker:
    build: .
    image: chameleon-audio:latest
    container_name: chameleon-worker
    volumes:
      - ./data:/data
      - ./output:/output
    environment:
      - CHAMELEON_MODE=worker
      - WORKER_CONCURRENCY=4
    command: python chameleon.py batch /data -o /output --parallel
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  chameleon-gui:
    build: .
    image: chameleon-audio:latest
    container_name: chameleon-gui
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./output:/output
    environment:
      - DISPLAY=${DISPLAY}
      - CHAMELEON_MODE=gui
    command: python audio_gui.py
    network_mode: host

volumes:
  data:
    driver: local
  output:
    driver: local

networks:
  default:
    name: chameleon-network