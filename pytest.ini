[tool:pytest]
# Chameleon Audio System - PyTest Configuration
# =============================================

# Test discovery
python_files = test_*.py *_test.py test_framework.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = 
    .
    tests

# Minimum version
minversion = 6.0

# Add options
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10
    --cov=.
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --junitxml=test_results/junit.xml

# Test markers
markers =
    unit: Unit tests
    integration: Integration tests  
    performance: Performance tests
    stress: Stress tests
    regression: Regression tests
    smoke: Smoke tests
    slow: Slow running tests (>30s)
    audio: Audio processing tests
    streaming: Real-time streaming tests
    voice: Voice processing tests
    ml: Machine learning tests
    network: Network related tests
    gpu: Tests requiring GPU
    skip_ci: Skip in CI environment

# Filtering
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Coverage
[coverage:run]
source = .
omit = 
    test_*
    *_test.py
    setup.py
    benchmark_*.py
    */site-packages/*
    */venv/*
    */env/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod