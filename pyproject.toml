[build-system]
requires = [
    "setuptools>=60.0.0",
    "wheel>=0.37.0",
    "build>=0.7.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "chameleon-audio"
version = "1.0.0"
description = "Commercial-grade WAV audio processing CLI with enterprise security, performance monitoring, and multilingual UX"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Chameleon Audio Team", email = "contact@chameleon-audio.com"}
]
maintainers = [
    {name = "Chameleon Audio Team", email = "contact@chameleon-audio.com"}
]
keywords = [
    "audio", "processing", "wav", "sound", "waveform", "multimedia",
    "analysis", "conversion", "editing", "batch-processing", "cli-tool",
    "security", "performance", "optimization", "professional", "enterprise",
    "benchmarking", "monitoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Topic :: System :: Archiving",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Spanish",
    "Natural Language :: French",
    "Natural Language :: German",
    "Natural Language :: Italian",
    "Natural Language :: Portuguese",
    "Natural Language :: Russian",
    "Natural Language :: Korean"
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.8",
    "isort>=5.13",
    "flake8>=7.0",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "psutil>=5.9",
    "memory-profiler>=0.61",
    "bandit>=1.7",
    "safety>=3.2",
    "twine>=5.1",
    "build>=1.2",
    "sphinx>=7.3",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0"
]

[project.scripts]
chameleon = "audio_tool:main"

[project.urls]
Documentation = "file://./docs/user_manual.md"

[tool.setuptools]
py-modules = ["audio_tool"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.json", "*.cfg", "*.ini"]