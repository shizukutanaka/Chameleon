# Chameleon Audio Processing Framework - Production Configuration
# Optimized for enterprise and government-level deployments

app:
  name: "Chameleon Audio Processing Framework"
  version: "2.0.0"
  environment: "production"
  lang: "en"
  debug_mode: false
  profile: "production"

# Security Configuration
security:
  # File system security
  enable_path_validation: true
  restrict_to_audio_files: true
  max_path_length: 260
  allow_symlinks: false
  
  # Processing limits
  max_file_size_mb: 100  # Conservative limit for production
  max_processing_time_sec: 300  # 5 minutes max
  sandbox_temp_files: true
  
  # Rate limiting
  max_concurrent_operations: 5
  max_operations_per_minute: 100
  
  # Input validation
  strict_filename_validation: true
  sanitize_user_input: true
  log_security_events: true

# Audio Processing Configuration
audio:
  # Default settings
  sample_rate: 44100
  channels: 1
  format: "wav"
  bit_depth: 16
  quality: "high"
  
  # Generation defaults
  default_frequency: 440.0
  default_duration: 1.0
  default_amplitude: 0.8
  
  # Processing limits (conservative for production)
  max_frequency: 48000.0
  min_frequency: 20.0
  max_duration: 1800.0  # 30 minutes max
  min_duration: 0.01
  
  # Processing options
  use_lut_optimization: true
  normalize_output: false  # Preserve original audio characteristics
  auto_trim_silence: false
  enable_multi_channel: true

# Format Support
formats:
  # Supported formats (limited for security)
  input_formats: ["wav", "flac"]  # Only lossless formats in production
  output_formats: ["wav", "flac"]
  
  # Default preferences
  output_format: "wav"
  fallback_format: "wav"
  
  # Quality settings
  flac_compression: 8  # Maximum compression
  preserve_bit_depth: true

# Path Configuration
paths:
  output_dir: "/app/output"
  temp_dir: "/app/temp"
  profiles_dir: "/app/profiles"
  logs_dir: "/app/logs"
  config_dir: "/app/config"
  
  # Path organization
  organize_by_date: true
  organize_by_format: true
  create_subdirs: true
  auto_cleanup_temp: true
  temp_retention_hours: 1

# Performance Configuration
performance:
  # Processing optimization
  enable_cache: true
  max_cache_size: 32  # Conservative cache size
  parallel_processing: false  # Disabled for stability in production
  max_workers: 2  # Limited for resource control
  
  # Memory management
  memory_limit_mb: 256  # Conservative limit
  file_size_limit_mb: 100
  chunk_size_mb: 5
  
  # CPU and resource limits
  cpu_limit_percent: 50  # Maximum 50% CPU usage
  enable_resource_monitoring: true
  enforce_resource_limits: true
  
  # Optimization settings
  use_fast_mode: false  # Prioritize quality over speed
  enable_optimizations: true
  preload_lut: true
  garbage_collection_aggressive: true

# Logging Configuration
logging:
  # Log levels
  level: "WARNING"  # Minimal logging for production
  enable_performance_logging: true
  enable_audio_logging: false
  enable_debug_logging: false
  enable_security_logging: true
  
  # File logging
  file: "/app/logs/chameleon.log"
  max_log_size_mb: 10
  backup_count: 10
  
  # Log format and content
  use_structured_logging: true
  include_timestamps: true
  include_process_info: true
  include_stack_traces: false  # Security consideration
  
  # Log rotation
  rotate_daily: true
  compress_old_logs: true
  retain_logs_days: 30

# Monitoring and Health Checks
monitoring:
  # Health check configuration
  enable_health_checks: true
  health_check_port: 8080
  health_check_path: "/health"
  
  # Performance monitoring
  enable_performance_monitoring: true
  monitoring_interval_sec: 60
  
  # Metrics retention
  metrics_retention_hours: 24
  detailed_metrics: false
  
  # Alerting thresholds
  cpu_alert_threshold: 70
  memory_alert_threshold: 80
  disk_space_alert_threshold: 85

# Batch Processing
batch:
  # Batch size limits
  max_batch_size: 5  # Conservative for production
  max_concurrent_batches: 2
  
  # Progress and error handling
  show_progress: false  # Reduce output noise
  continue_on_error: false  # Fail fast in production
  
  # Timeouts
  batch_timeout_sec: 1800  # 30 minutes
  operation_timeout_sec: 300  # 5 minutes per operation

# Network Configuration (if applicable)
network:
  # Service binding
  bind_host: "0.0.0.0"
  bind_port: 8080
  
  # Connection limits
  max_connections: 10
  connection_timeout_sec: 30
  request_timeout_sec: 60
  
  # SSL/TLS (if enabled)
  enable_ssl: false
  ssl_cert_path: ""
  ssl_key_path: ""

# Database Configuration (if applicable)
database:
  # Connection settings
  enabled: false
  type: "sqlite"
  path: "/app/data/chameleon.db"
  
  # Connection pool
  max_connections: 5
  connection_timeout_sec: 30

# Backup and Recovery
backup:
  # Automatic backup
  enable_auto_backup: true
  backup_interval_hours: 24
  backup_retention_days: 7
  backup_location: "/app/backups"
  
  # Backup verification
  verify_backups: true
  test_restore: false

# Compliance and Auditing
compliance:
  # Audit logging
  enable_audit_logging: true
  audit_log_path: "/app/logs/audit.log"
  
  # Data retention
  data_retention_days: 90
  auto_cleanup_old_data: true
  
  # Compliance features
  enable_data_encryption: false  # Implement if required
  enable_access_logging: true
  enable_operation_tracking: true

# Environment-specific overrides
production:
  security:
    max_file_size_mb: 50  # Even more conservative
    max_processing_time_sec: 180  # 3 minutes
    max_concurrent_operations: 3
  
  performance:
    memory_limit_mb: 128
    max_workers: 1
    
  logging:
    level: "ERROR"  # Only errors in production