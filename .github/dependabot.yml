version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    allow:
      - dependency-type: "direct"
    # GitHub-native Dependabot has no automerge option (it existed only on
    # dependabot.com). The v2 schema rejects unknown keys, so the previous
    # 'automerge' entry failed validation. Real auto-merge needs the repo's
    # "Allow auto-merge" setting plus a workflow, not this file.
    schedule:
      interval: "weekly"
