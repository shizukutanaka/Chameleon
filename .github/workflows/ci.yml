name: Chameleon Audio CI/CD

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.9'

jobs:
  lint-and-format:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install linting dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
    
    - name: Run Black formatter check
      run: black --check --diff .
      continue-on-error: true
    
    - name: Run isort import sorting check
      run: isort --check-only --diff .
      continue-on-error: true
    
    - name: Run flake8 linter
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run basic syntax check
      run: python -m py_compile *.py

  test:
    name: Tests & Coverage
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          - os: windows-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.8'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-
          ${{ runner.os }}-pip-
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install portaudio
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-timeout
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run comprehensive tests
      run: |
        python -m pytest test_comprehensive.py -v --cov=. --cov-report=xml --cov-report=term-missing --timeout=300
      continue-on-error: ${{ matrix.python-version != '3.9' || matrix.os != 'ubuntu-latest' }}
    
    - name: Run main application tests
      run: |
        python test_main.py
      continue-on-error: true
    
    - name: Run system integration tests
      run: |
        python test_system.py
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.9' && matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  performance:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    needs: [lint-and-format, test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        sudo apt-get update && sudo apt-get install -y portaudio19-dev
        pip install -r requirements.txt
    
    - name: Run performance benchmarks
      run: |
        python benchmark_simple.py
    
    - name: Performance regression check
      run: |
        python -c "
        import time
        import numpy as np
        try:
            from audio_processor import AudioProcessor
            from voice_processor import VoiceProcessor
            
            # Quick performance check
            processor = AudioProcessor()
            samples = np.random.randint(-1000, 1000, 44100, dtype=np.int16)
            
            start = time.time()
            result = processor.process_audio(samples, {'gain': 1.0})
            elapsed = time.time() - start
            
            rtf = elapsed / (len(samples) / 44100)
            print(f'Real-time factor: {rtf:.4f}')
            
            if rtf > 1.0:
                print('WARNING: Processing not real-time capable')
                exit(1)
            else:
                print('✓ Performance check passed')
        except ImportError as e:
            print(f'Performance check skipped: {e}')
        "

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
    
    - name: Check for known vulnerabilities
      run: |
        safety check --json || echo "Safety check completed with warnings"
    
    - name: Run Bandit security scan
      run: |
        bandit -r . -f json -o bandit-report.json || echo "Bandit scan completed"
    
    - name: Upload security scan results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-scan-results
        path: bandit-report.json

  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [test, performance, security]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build wheel
    
    - name: Build package
      run: |
        python -m build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist-packages
        path: dist/

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [lint-and-format, test, performance, security, build]
    if: always()
    
    steps:
    - name: Notify success
      if: needs.test.result == 'success' && needs.performance.result == 'success'
      run: |
        echo "✅ All checks passed!"
        echo "Build is ready for deployment"
    
    - name: Notify failure
      if: needs.test.result == 'failure' || needs.performance.result == 'failure'
      run: |
        echo "❌ Some checks failed!"
        echo "Please review the failed jobs above"
        exit 1
